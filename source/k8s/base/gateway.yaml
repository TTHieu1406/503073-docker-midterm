apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  selector: { app: gateway }
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway, tier: edge }
    spec:
      automountServiceAccountToken: false   # these pods never call the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: dockmart/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            # Nginx's own resolver ignores the `search` list in /etc/resolv.conf,
            # so short names like `api` do not work here. Full names are required.
            - { name: API_UPSTREAM, value: "api.dockmart.svc.cluster.local:4000" }
            - { name: WEB_UPSTREAM, value: "web.dockmart.svc.cluster.local:8080" }
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /gateway/health, port: 8080 }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 64Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
