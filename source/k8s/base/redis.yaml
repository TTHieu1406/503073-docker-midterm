apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app: redis }
spec:
  selector: { app: redis }
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, tier: data }
    spec:
      automountServiceAccountToken: false   # these pods never call the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 999       # `redis` in the Alpine image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:8.10.3-alpine
          command:
            - sh
            - -c
            - exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$(cat /run/secrets/redis_password)"
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$(cat /run/secrets/redis_password)" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$(cat /run/secrets/redis_password)" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 10
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: dockmart-secrets
            items:
              - { key: redis_password, path: redis_password }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 256Mi
