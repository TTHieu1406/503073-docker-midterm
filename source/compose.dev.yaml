# Development overrides, merged on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.dev.yaml watch
#
# `watch` copies changed files into the running containers instead of using bind
# mounts, so it behaves the same on Windows, macOS and Linux, and also works from a
# synced folder such as OneDrive. No Node.js is needed on the host.

services:
  gateway:
    environment:
      WEB_UPSTREAM: web:5173

  web:
    build:
      target: development
    image: dockmart/web:dev
    read_only: false
    cap_drop: !reset []
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 1G }
    develop:
      watch:
        - { action: sync, path: ./web/src, target: /app/src }
        - { action: sync, path: ./web/public, target: /app/public }
        - { action: rebuild, path: ./web/package.json }

  api:
    build:
      target: development
    image: dockmart/backend:dev
    command: ["node", "--watch", "src/server.js"]
    read_only: false
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "2.00", memory: 512M }
    develop:
      watch:
        - { action: sync, path: ./backend/src, target: /app/src }
        - { action: rebuild, path: ./backend/package.json }

  worker:
    build:
      target: development
    image: dockmart/backend:dev
    command: ["node", "--watch", "src/worker.js"]
    read_only: false
    environment:
      NODE_ENV: development
    deploy:
      replicas: 1
    develop:
      watch:
        - { action: sync, path: ./backend/src, target: /app/src }

  migrate:
    build:
      target: development
    image: dockmart/backend:dev
    read_only: false
