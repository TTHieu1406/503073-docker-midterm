apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  clusterIP: None        # headless: gives the StatefulSet pod a stable DNS name
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres, tier: data }
    spec:
      automountServiceAccountToken: false   # these pods never call the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # `postgres` in the Alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_USER, value: dockmart }
            - { name: POSTGRES_DB, value: dockmart }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/db_password }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dockmart", "-d", "dockmart"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "dockmart", "-d", "dockmart"]
            periodSeconds: 10
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: socket, mountPath: /var/run/postgresql }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
      volumes:
        - name: socket
          emptyDir: {}
        - name: secrets
          secret:
            secretName: dockmart-secrets
            items:
              - { key: db_password, path: db_password }
  # Kubernetes creates a PersistentVolumeClaim per pod and keeps it across restarts.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
