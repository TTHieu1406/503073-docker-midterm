# Pipeline for a GitHub repository whose root is this folder. It was not executed during
# the coursework. The same steps were run by hand (see the README).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (Dockerfile test targets)
        run: |
          docker build --target test backend
          docker build --target test web
      - name: End-to-end tests against the real stack
        run: |
          docker compose up -d --build --wait
          docker compose --profile test run --rm smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100

  publish:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, web, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
