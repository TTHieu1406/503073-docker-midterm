apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker, tier: backend }
    spec:
      automountServiceAccountToken: false   # these pods never call the Kubernetes API
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: dockmart/backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "src/worker.js"]
          envFrom:
            - configMapRef: { name: dockmart-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /health/live, port: 4001 }
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: 4001 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
      volumes:
        - name: secrets
          secret:
            secretName: dockmart-secrets
